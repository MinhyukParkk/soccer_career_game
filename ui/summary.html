<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Club Carrera — Career Complete</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  /* Page-specific layout for the career summary / archive screen only. */

  .hero {
    text-align: center;
    padding: 40px 0 30px;
    border-bottom: 3px solid var(--ink);
  }
  .hero .eyebrow { font-size: 12px; letter-spacing: 0.14em; color: var(--ink-dim); text-transform: uppercase; }
  .hero h1 { font-size: 60px; margin: 6px 0 0; }
  .hero .legacy-stamp {
    display: inline-block; margin-top: 14px;
    border: 2px solid var(--red); color: var(--red);
    font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 0.08em;
    padding: 8px 20px; text-transform: uppercase;
  }

  .summary-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 20px;
    padding: 34px 0;
  }
  .stat-card { border: 1.5px solid var(--ink); padding: 20px; text-align: center; }
  .stat-card .num { font-family: 'Bebas Neue', sans-serif; font-size: 40px; }
  .stat-card .lab { font-size: 11px; letter-spacing: 0.08em; color: var(--ink-faint); text-transform: uppercase; margin-top: 4px; }

  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    letter-spacing: 0.03em;
    border-bottom: 1px solid var(--ink);
    padding-bottom: 8px;
    margin: 30px 0 18px;
  }

  .club-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .club-card { border: 1.5px solid var(--ink); padding: 16px; }
  .club-card .club-name { font-family: 'Bebas Neue', sans-serif; font-size: 18px; margin-bottom: 4px; }
  .club-card .club-meta { font-size: 12px; color: var(--ink-dim); margin-bottom: 10px; }
  .club-card .club-stats {
    display: flex; justify-content: space-between;
    font-size: 12.5px; color: var(--ink-dim);
    border-top: 1px dotted var(--ink-faint); padding-top: 8px;
  }
  .club-card .club-stats b { color: var(--ink); font-family: 'Bebas Neue', sans-serif; font-size: 14px; }

  .note-box {
    font-size: 12.5px; color: var(--ink-dim); font-style: italic;
    border-top: 1px dotted var(--ink-faint); padding-top: 12px; margin-top: 14px;
  }

  .trophy-cabinet {
    border: 1.5px solid var(--ink);
    padding: 20px;
    text-align: center;
    font-size: 13px;
    color: var(--ink-faint);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .footer-actions {
    display: flex;
    justify-content: center;
    gap: 14px;
    padding: 30px 0 50px;
  }
</style>
</head>
<body>

  <nav class="site-nav">
    <div class="logo"><span class="mark">⬢</span> CLUB CARRERA</div>
    <div class="links">
      <a href="#" class="current">Career</a>
      <a href="history.html">History</a>
      <a href="#">How It Works</a>
      <a href="#">Blog</a>
    </div>
    <div class="auth">
      <a href="#">Log in</a>
      <a href="#" class="signup">Sign up</a>
    </div>
  </nav>

  <div class="subnav">
    <span>Career Sim / Retired</span>
    <span id="finalAgeLabel">Age —</span>
  </div>

  <div class="page">

    <div class="hero">
      <div class="eyebrow">Career Complete</div>
      <h1 id="heroName">PLAYER</h1>
      <div class="legacy-stamp" id="legacyStamp">—</div>
    </div>

    <div class="summary-grid" id="statGrid"><!-- rendered by JS --></div>

    <div class="section-title">Clubs Represented</div>
    <div class="club-list" id="clubList"><!-- rendered by JS --></div>

    <div class="section-title">Honours Cabinet</div>
    <div class="trophy-cabinet" id="trophyCabinet">Empty Trophy Case</div>

    <div class="footer-actions">
      <button class="back-btn" id="viewHistoryBtn">View Career History</button>
      <button class="back-btn" id="saveHistoryBtn">Save This Career</button>
      <button class="kickoff-btn" id="playAgainBtn">Play Again</button>
    </div>

  </div>

  <div class="site-footer">
    <span>Club Carrera · Sim Engine 0.1</span>
    <span>Runs In Your Browser</span>
  </div>

<script type="module">
  import { generateSummary } from "../engine/summary.js";
  import { computeMarketValue, computeOverall } from "../engine/rating.js";
  import clubs from "../data/clubs.js";
  import { saveCareerRecord } from "./careerHistory.js";

  const saved = sessionStorage.getItem("clubCarreraPlayer");
  const dir = window.location.pathname.substring(0, window.location.pathname.lastIndexOf("/") + 1);
  if (!saved) {
    console.warn("No player found — redirecting to character creation.");
    window.location.href = dir + "characterCreation.html";
  }
  const player = JSON.parse(saved);
  const summary = generateSummary(player);

  function clubInfo(id) {
    return clubs.find((c) => c.id === id) || { name: id, tier: "?", country: "?" };
  }

  document.getElementById("heroName").textContent =
    `${player.identity.lastName.toUpperCase()} · #${player.identity.number}`;
  document.getElementById("finalAgeLabel").textContent = `Retired at Age ${player.age}`;
  document.getElementById("legacyStamp").textContent = summary.legacyTier;

  document.getElementById("statGrid").innerHTML = `
    <div class="stat-card"><div class="num">${summary.totalMatches}</div><div class="lab">Matches</div></div>
    <div class="stat-card"><div class="num">${summary.totalGoals}</div><div class="lab">Goals</div></div>
    <div class="stat-card"><div class="num">${summary.totalAssists}</div><div class="lab">Assists</div></div>
    <div class="stat-card"><div class="num">${summary.internationalCaps}</div><div class="lab">Int'l Caps</div></div>
    <div class="stat-card"><div class="num">€${computeMarketValue(player)}M</div><div class="lab">Peak Value</div></div>
    <div class="stat-card"><div class="num">${summary.clubStints.length}</div><div class="lab">Clubs</div></div>
  `;

  // Every stint on the journey, in chronological order, each with its own
  // real apps/goals/assists — not just a name, an actual per-club record.
  document.getElementById("clubList").innerHTML = summary.clubStints
    .map((stint) => {
      const club = clubInfo(stint.clubId);
      return `
        <div class="club-card">
          <div class="club-name">${club.name}</div>
          <div class="club-meta">${club.league ?? "Tier " + club.tier} · ${club.country}</div>
          <div class="club-stats">
            <span><b>${stint.matches}</b> APPS</span>
            <span><b>${stint.goals}</b> GLS</span>
            <span><b>${stint.assists}</b> AST</span>
          </div>
        </div>`;
    })
    .join("");

  const trophies = [...summary.collectiveTitles, ...summary.individualAwards];
  document.getElementById("trophyCabinet").textContent = trophies.length
    ? trophies.join(" · ")
    : "Empty Trophy Case";

  // Saving is the player's choice — nothing is written to history until
  // they explicitly click "Save This Career".
  function buildCareerRecord() {
    return {
      id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
      savedAt: Date.now(),
      lastName: player.identity.lastName,
      number: player.identity.number,
      position: player.identity.position,
      country: player.identity.country,
      finalAge: player.age,
      finalOvr: computeOverall(player),
      legacyTier: summary.legacyTier,
      totalMatches: summary.totalMatches,
      totalGoals: summary.totalGoals,
      totalAssists: summary.totalAssists,
      internationalCaps: summary.internationalCaps,
      peakValueM: computeMarketValue(player),
      finalClubId: player.career.currentClub,
      clubsCount: summary.clubStints.length,
      collectiveTitles: summary.collectiveTitles,
      individualAwards: summary.individualAwards,
    };
  }

  const saveBtn = document.getElementById("saveHistoryBtn");
  saveBtn.addEventListener("click", () => {
    const ok = saveCareerRecord(buildCareerRecord());
    saveBtn.textContent = ok ? "Saved ✓" : "Save Failed";
    saveBtn.disabled = true;
  });

  document.getElementById("playAgainBtn").addEventListener("click", () => {
    sessionStorage.removeItem("clubCarreraPlayer");
    window.location.href = dir + "characterCreation.html";
  });

  document.getElementById("viewHistoryBtn").addEventListener("click", () => {
    window.location.href = dir + "history.html";
  });
</script>

</body>
</html>
